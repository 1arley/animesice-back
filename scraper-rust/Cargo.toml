[package]
name = "animefire-scraper"
version = "0.1.0"
edition = "2021"

[dependencies]
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "signal", "time", "process", "io-util", "net"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
tokio-postgres-rustls = "0.13"
rustls = "0.23"
webpki-roots = "1"

[[bin]]
name = "watchtower-worker"
path = "src/watchtower_worker.rs"
