name: animesice-nestjs

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nestjs-app
    restart: unless-stopped
    user: "root"
    ports:
      - '${PORT:-3000}:3000'
    env_file:
      - .env
    environment:
      # DATABASE_URL vem do .env — em prod aponta pro Postgres da VPS,
      # não pro container local.
      - DATABASE_URL=${DATABASE_URL}
    volumes:
      - .:/app
      - /app/node_modules
    command: >
      sh -c "
        npm install &&
        npx prisma generate &&
        npx prisma migrate deploy &&
        npm run start:dev
      "
    networks:
      - nestjs-network

volumes: {}

networks:
  nestjs-network:
    driver: bridge
