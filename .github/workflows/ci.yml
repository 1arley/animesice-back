# Continuous Integration
# Runs on PRs and pushes to the protected branches (main, dev).
# Performs: lockfile validation, lint, format check, typecheck,
# unit tests (with coverage), e2e tests (Postgres service), build,
# and a Docker image build smoke test.
name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege: CI only needs to read the repo.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Static quality gate: lint + formatting + type checking.
  # Runs first and in parallel with the test jobs; a failure here fails the
  # whole pipeline immediately (each job bubbles up a failed required check).
  # ---------------------------------------------------------------------------
  quality:
    name: Lint · Format · Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js & dependencies
        uses: ./.github/actions/node-setup

      - name: Lint
        run: npm run lint

      - name: Check formatting
        # prettier --check mirrors the local `format` script without writing.
        run: npx prettier --check "src/**/*.ts" "test/**/*.ts"

      - name: Typecheck
        # tsc --noEmit validates the whole project (src + test) against the
        # strict tsconfig.json without emitting artifacts.
        run: npx tsc --noEmit -p tsconfig.json

  # ---------------------------------------------------------------------------
  # Unit tests with coverage. Coverage report is uploaded as an artifact.
  # ---------------------------------------------------------------------------
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js & dependencies
        uses: ./.github/actions/node-setup

      # .env.test provides DATABASE_URL/JWT secrets for modules that read the
      # environment at import time. dotenv-cli is a devDependency.
      - name: Run unit tests with coverage
        run: npx dotenv-cli -e .env.test -- npm run test:unit -- --coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------------------------
  # E2E tests against an ephemeral PostgreSQL service container.
  # Uses a real DB (deterministic, matches production datasource provider).
  # ---------------------------------------------------------------------------
  e2e-tests:
    name: E2E tests
    runs-on: ubuntu-latest

    # Postgres service container is mapped to the port configured in .env.test
    # (5433 on the runner -> 5432 in the container).
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: animesice-db-test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js & dependencies
        uses: ./.github/actions/node-setup

      # Push the Prisma schema to the ephemeral test DB (no migration files
      # required; db push --force-reset gives a clean, deterministic schema).
      - name: Push schema to test database
        run: npx dotenv-cli -e .env.test -- npx prisma db push --force-reset

      - name: Run E2E tests
        run: npx dotenv-cli -e .env.test -- npx jest --config ./test/jest-e2e.json --runInBand --forceExit

  # ---------------------------------------------------------------------------
  # Build the NestJS app. Depends on tests passing so we never ship a build
  # from a red tree.
  # ---------------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [quality, unit-tests, e2e-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js & dependencies
        uses: ./.github/actions/node-setup

      - name: Build project
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Docker image build smoke test. GHA cache keeps it fast.
  # ---------------------------------------------------------------------------
  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: animesice-back:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
