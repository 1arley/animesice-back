name: CI

on:
  pull_request:
    branches: [main, dev]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx dotenv-cli -e .env.test -- npx prisma generate

      - name: Run linter
        run: npm run lint

      - name: Run tests
        run: npx dotenv-cli -e .env.test -- npm test

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Start test database
        run: docker compose -f docker-compose.test.yml up -d --wait

      - name: Generate Prisma Client
        run: npx dotenv-cli -e .env.test -- npx prisma generate

      - name: Push database schema
        run: npx dotenv-cli -e .env.test -- npx prisma db push --force-reset

      - name: Run linter
        run: npm run lint

      - name: Run E2E tests
        run: npx dotenv-cli -e .env.test -- npx jest --config ./test/jest-e2e.json --runInBand --forceExit

      - name: Stop test database
        if: always()
        run: docker compose -f docker-compose.test.yml rm -sf

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t nestjs-template:test .

      - name: Verify image
        run: docker images nestjs-template:test
