# Continuous Delivery (production): build & push da imagem para o Docker Hub.
# O deploy em si é feito pela Watchtower na VPS, configurada no compose da VPS
# (/srv/animesice/animesice-back/docker-compose.yml, não versionado): label
# `com.centurylinklabs.watchtower.enable=true` + `prisma migrate deploy` no
# boot do container — então um push de `latest` é aplicado automaticamente,
# sem SSH.
#
# SAFETY:
#   - Only runs from a tag/release (never from a raw PR). PRs cannot deploy.
#   - Rollback: re-run this workflow manually and select a previous tag.
#
# NOTE on triggers: semantic-release creates tags/releases with the default
# GITHUB_TOKEN, and events caused by GITHUB_TOKEN never spawn new workflow
# runs — so a bare `release: [published]` trigger would never fire here.
# The `workflow_run` trigger on the Release workflow is the reliable path
# (workflow_run events are delivered regardless of token provenance).
name: Build & push image

on:
  release:
    types: [published]
  workflow_run:
    workflows: ['Release']
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to build & push (for rollback). Defaults to the tag on the running workflow_dispatch ref.'
        required: false
        default: ''

concurrency:
  # Only one build at a time; new runs wait for the previous to finish.
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build & push Docker image
    runs-on: ubuntu-latest

    # Safety gates:
    # - never from a PR
    # - automatic build only for stable releases (not prereleases from `dev`)
    # - after the Release workflow succeeds on main (semantic-release tag)
    # - workflow_dispatch always allowed (explicit rollback / hotfixes)
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'release' && github.event.release.prerelease == false) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')

    steps:
      - name: Resolve deploy ref
        id: ref
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "ref=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            # Release workflow tags the exact commit it ran against; checkout
            # that SHA and resolve the tag locally in the next step.
            echo "ref=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.tag }}" ]; then
            echo "ref=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout at deploy ref
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.ref.outputs.ref }}
          fetch-depth: 0

      # On workflow_run the ref is the release commit SHA; resolve the actual
      # release tag via the API (git describe would return the previous tag,
      # since the semantic-release tag points at a child commit).
      - name: Resolve release tag
        id: tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "tag=$(gh api repos/${{ github.repository }}/releases/latest --jq .tag_name)" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ steps.ref.outputs.ref }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # Tag with the release tag (e.g. v1.2.3) and `latest` — a Watchtower
          # na VPS detecta o novo `latest` e atualiza o container (com migração
          # no boot), então nenhum passo remoto é necessário aqui.
          tags: |
            ${{ secrets.DOCKERHUB_REPO }}:${{ steps.tag.outputs.tag }}
            ${{ secrets.DOCKERHUB_REPO }}:latest
          provenance: false
