# Continuous Deployment (production).
# Builds the Docker image, pushes to Docker Hub, then SSHes to the VPS
# to pull and recreate the container. Watchtower auto-updates are disabled
# for this flow — explicit deploy ensures deterministic tags.
#
# SAFETY:
#   - Only runs from a tag/release (never from a raw PR). PRs cannot deploy.
#   - Uses the `production` GitHub Environment so protection rules
#     (required reviewers, wait timer) apply before any server change.
#   - Rollback: re-run this workflow manually and select a previous tag.
name: Deploy

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to deploy (for rollback). Defaults to the tag on the running workflow_dispatch ref.'
        required: false
        default: ''

concurrency:
  # Only one deployment at a time; new deploys wait for the previous to finish
  # (do not cancel mid-deploy).
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    # The `production` Environment must be created in repo settings; add
    # protection rules (required reviewers, deployment branch = main, wait
    # timer) so nothing reaches the server without human approval.
    environment: production

    # Safety gates:
    # - never from a PR
    # - automatic deploy only for stable releases (not prereleases from `dev`)
    # - workflow_dispatch always allowed (explicit rollback / hotfixes)
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'release' && github.event.release.prerelease == false)

    steps:
      - name: Resolve deploy ref
        id: ref
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "ref=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.tag }}" ]; then
            echo "ref=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout at deploy ref
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # Tag with the release tag (e.g. v1.2.3) and `latest` for the
          # server's `docker compose pull` to pick up by default.
          tags: |
            ${{ secrets.DOCKERHUB_REPO }}:${{ steps.ref.outputs.ref }}
            ${{ secrets.DOCKERHUB_REPO }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # Remote deploy over SSH. The server has docker compose and the compose
      # file at DEPLOY_APP_DIR that references the Docker Hub image.
      # Secrets are never logged.
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          envs: |
            DEPLOY_TAG
            DEPLOY_APP_DIR
            DOCKERHUB_USERNAME
            DOCKERHUB_TOKEN
          script: |
            set -euo pipefail
            export DEPLOY_APP_DIR="${{ secrets.DEPLOY_APP_DIR }}"
            export DOCKERHUB_USERNAME="${{ secrets.DOCKERHUB_USERNAME }}"
            export DOCKERHUB_TOKEN="${{ secrets.DOCKERHUB_TOKEN }}"
            export DEPLOY_TAG="${{ steps.ref.outputs.ref }}"

            cd "$DEPLOY_APP_DIR"

            # Authenticate to Docker Hub (private repos or rate-limit).
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

            # Pull the exact tag and recreate the app container (DB stays up).
            docker compose pull app
            docker compose up -d --no-deps app

            # Optional rollback safety: keep recent images around for ~7 days.
            docker image prune -f --filter "until=168h" || true

            echo "Deployed $DEPLOY_TAG to $DEPLOY_APP_DIR"
