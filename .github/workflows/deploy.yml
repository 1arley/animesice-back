# Continuous Delivery (production): build & push da imagem para o Docker Hub.
# O deploy em si é feito pela Watchtower na VPS, configurada no compose da VPS
# (/srv/animesice/animesice-back/docker-compose.yml, não versionado): label
# `com.centurylinklabs.watchtower.enable=true` + `prisma migrate deploy` no
# boot do container — então um push de `latest` é aplicado automaticamente,
# sem SSH.
#
# SAFETY:
#   - Only runs from a tag/release (never from a raw PR). PRs cannot deploy.
#   - Rollback: re-run this workflow manually and select a previous tag.
#
# NOTE on triggers: semantic-release creates tags/releases with the default
# GITHUB_TOKEN, and events caused by GITHUB_TOKEN never spawn new workflow
# runs — so a bare `release: [published]` trigger would never fire here.
# The `workflow_run` trigger on the Release workflow is the single automatic
# path (workflow_run events are delivered regardless of token provenance).
# Releases published by hand are covered by `workflow_dispatch` instead, which
# keeps exactly one automatic trigger and avoids building the same tag twice.
name: Build & push image

on:
  workflow_run:
    workflows: ['Release']
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to build & push (for rollback). Defaults to the tag on the running workflow_dispatch ref.'
        required: false
        default: ''

concurrency:
  # Only one build at a time; new runs wait for the previous to finish.
  group: deploy-production
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  deploy:
    name: Build & push Docker image
    runs-on: ubuntu-latest

    # Safety gates:
    # - never from a PR
    # - automatic build only after the Release workflow succeeds on main
    #   (semantic-release stable tag); prereleases from `dev` produce no tag
    #   in release-info.json, so the resolve step below skips them.
    # - workflow_dispatch always allowed (explicit rollback / hotfixes)
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')

    steps:
      - name: Download release result
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v8
        with:
          name: release-info
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Resolve deploy ref
        id: ref
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            # Release grava o tag no artifact; vazio = semantic-release não
            # produziu release (ex.: commit sem mudança relevante).
            tag="$(jq -r '.tag // empty' release-info.json)"
          elif [ -n "$MANUAL_TAG" ]; then
            tag="$MANUAL_TAG"
          else
            tag="$GITHUB_REF_NAME"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ -z "$tag" ]; then
            echo "No release was created; skipping image publish."
          fi

      - name: Checkout release tag
        if: steps.ref.outputs.tag != ''
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ steps.ref.outputs.tag }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        if: steps.ref.outputs.tag != ''
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: steps.ref.outputs.tag != ''
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push image
        if: steps.ref.outputs.tag != ''
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # Tag with the release tag (e.g. v1.2.3) and `latest` — a Watchtower
          # na VPS detecta o novo `latest` e atualiza o container (com migração
          # no boot), então nenhum passo remoto é necessário aqui.
          tags: |
            ${{ secrets.DOCKERHUB_REPO }}:${{ steps.ref.outputs.tag }}
            ${{ secrets.DOCKERHUB_REPO }}:latest
          provenance: false
